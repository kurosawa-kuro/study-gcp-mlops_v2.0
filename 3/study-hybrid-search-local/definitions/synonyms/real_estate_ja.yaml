# Phase 3 SYN-1 — Synonym dictionary for real-estate hybrid search.
#
# Schema: each top-level key is a *canonical token* the user might type.
# The list value is the set of synonyms loaded into Redis as a SET under
# the key ``syn:<token>``. ``RedisSynonymExpander`` then injects the union
# of original tokens + synonyms into the lexical query before BM25.
#
# Why dictionary rather than embedding nearest-neighbour?
# Lexical query expansion lives upstream of BM25 — Meilisearch does not see
# semantics. We want a curated, deterministic list of property-domain
# synonyms (housing types, layouts, station-distance idioms, amenities)
# that a real-estate operator can audit and edit. The semantic side
# already covers free-form synonymy via multilingual-e5.
#
# Editorial guidance:
# - Keep entries to property-domain vocabulary.
# - Avoid entries that change meaning (e.g. ``南向き`` → ``東向き``).
# - Avoid runaway expansion: cap each list at ~8 synonyms; the
#   ``synonym_max_synonyms_per_token`` setting truncates further at the
#   adapter boundary.
# - Free of regional bias unless the locality is unambiguous.

