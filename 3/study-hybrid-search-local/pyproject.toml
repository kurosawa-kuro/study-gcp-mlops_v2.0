[project]
name = "study-hybrid-search-local"
version = "0.1.0"
description = "Phase 3: 不動産ハイブリッド検索 (Local) — Meilisearch BM25 + multilingual-e5 + pgvector + RRF + LightGBM LambdaRank。Phase 7 (canonical) から GCP / K8s を引き算した Local 完成形。Phase 4 (GCP MLOps 土台) への足し算起点。"
requires-python = ">=3.12"
# Phase 3 dependencies — Phase 7 から google-cloud-* / kfp / kserve を全削除した最小集合。
# Local Docker Compose で完結する。Phase 4 で google-cloud-* を adapter 別ファイルとして
# 足し算で追加する想定。
dependencies = [
    # --- shared (api / ml / pipeline) ---
    "pydantic>=2.8",
    "pydantic-settings[yaml]>=2.4",
    "pandas>=2.2",
    "numpy>=2.0",
    # --- app (FastAPI runtime) ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "jinja2>=3.1",
    # --- adapters (Meilisearch / PostgreSQL+pgvector / Redis) ---
    "meilisearch>=0.31",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "pgvector>=0.3",
    "redis>=5.0",
    # --- ML (in-process encoder / reranker) ---
    # Phase 3-7 で互換維持: lightgbm 4.5+ で Booster format を固定する。
    "lightgbm>=4.5,<5",
    "sentence-transformers>=3.0",
    # --- seed dataset 生成 ---
    "scikit-learn>=1.5",
]

[project.scripts]
seed = "pipeline.data_job.main:main"
rank-train = "pipeline.training_job.main:main"
rank-eval = "pipeline.evaluation_job.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "ml", "pipeline"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-cachetools",
    "types-redis",
    "pandas-stubs",
    # httpx powers fastapi.testclient (starlette); needed by tests/unit/app.
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "ml", "pipeline", "scripts"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["meilisearch.*", "sentence_transformers.*", "lightgbm.*", "pgvector.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: docker compose を立ち上げてから走らせる integration テスト",
    "e2e: end-to-end (seed → train → serve → /search の 1 周検証)",
]
