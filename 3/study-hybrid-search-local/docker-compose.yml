name: study-hybrid-search-local

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: phase3-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hybrid_search
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    # host port は 5433 にずらす (5432 を使う他プロジェクトとの衝突回避)。
    # container 間通信は名前解決 (postgres:5432) で行うので影響なし。
    # host から psql で接続したい場合は localhost:5433 を使う。
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./definitions/postgres/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d hybrid_search"]
      interval: 3s
      timeout: 3s
      retries: 20

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: phase3-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-phase3-local-master-key}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7700/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: phase3-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  seed:
    build:
      context: .
      dockerfile: infra/run/jobs/pipeline/Dockerfile
    container_name: phase3-seed
    environment:
      POSTGRES_DSN: postgresql://admin:${POSTGRES_PASSWORD:-password}@postgres:5432/hybrid_search
      MEILI_BASE_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-phase3-local-master-key}
      E5_MODEL_NAME: ${E5_MODEL_NAME:-intfloat/multilingual-e5-small}
      MODEL_ARTIFACTS_ROOT: /app/ml/registry/artifacts
    volumes:
      - ./ml/registry/artifacts:/app/ml/registry/artifacts
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    command: ["python", "-m", "pipeline.data_job.main"]

  # Phase 3 SYN-1 — Redis 同義語辞書 (lexical query expansion) を Redis に投入。
  # ``make seed`` の延長で実行 (postgres / meili 投入の後)。redis container は
  # 永続 volume を持たないので、container 再起動の度に流し直す前提。
  seed-synonyms:
    build:
      context: .
      dockerfile: infra/run/jobs/pipeline/Dockerfile
    container_name: phase3-seed-synonyms
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    command:
      - "python"
      - "-m"
      - "pipeline.data_job.components.sync_synonyms"
      - "--redis-url"
      - "redis://redis:6379/0"
      - "--dictionary"
      - "definitions/synonyms/real_estate_ja.yaml"

  trainer:
    build:
      context: .
      dockerfile: infra/run/jobs/pipeline/Dockerfile
    container_name: phase3-trainer
    environment:
      POSTGRES_DSN: postgresql://admin:${POSTGRES_PASSWORD:-password}@postgres:5432/hybrid_search
      MODEL_ARTIFACTS_ROOT: /app/ml/registry/artifacts
    volumes:
      - ./ml/registry/artifacts:/app/ml/registry/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    command: ["python", "-m", "pipeline.training_job.main"]

  evaluator:
    build:
      context: .
      dockerfile: infra/run/jobs/pipeline/Dockerfile
    container_name: phase3-evaluator
    environment:
      POSTGRES_DSN: postgresql://admin:${POSTGRES_PASSWORD:-password}@postgres:5432/hybrid_search
      MODEL_ARTIFACTS_ROOT: /app/ml/registry/artifacts
    volumes:
      - ./ml/registry/artifacts:/app/ml/registry/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "pipeline.evaluation_job.main"]

  search-api:
    build:
      context: .
      dockerfile: infra/run/services/api/Dockerfile
    container_name: phase3-search-api
    environment:
      POSTGRES_DSN: postgresql://admin:${POSTGRES_PASSWORD:-password}@postgres:5432/hybrid_search
      MEILI_BASE_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-phase3-local-master-key}
      REDIS_URL: redis://redis:6379/0
      E5_MODEL_NAME: ${E5_MODEL_NAME:-intfloat/multilingual-e5-small}
      MODEL_ARTIFACTS_ROOT: /app/ml/registry/artifacts
      ENABLE_SEARCH: "true"
      # Phase 3 SYN-1 — Redis 同義語辞書を有効化。
      # ``synonym_backend=none`` にすれば素通し (NoopSynonymExpander)。
      SYNONYM_BACKEND: "redis"
      SYNONYM_KEY_PREFIX: "syn:"
      SYNONYM_MAX_SYNONYMS_PER_TOKEN: "8"
      # Phase 3 SYN-2 — /search レスポンスキャッシュ (UX / latency)。
      # ``search_cache_backend=none`` で完全 OFF (毎回 live search)。
      # TTL 60s は不動産検索の在庫変動 vs 体感速度のバランスから取った教材値。
      SEARCH_CACHE_BACKEND: "redis"
      SEARCH_CACHE_KEY_PREFIX: "search:"
      SEARCH_CACHE_TTL_SECONDS: "60"
    ports:
      - "8000:8000"
    volumes:
      - ./ml/registry/artifacts:/app/ml/registry/artifacts:ro
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as r; r.urlopen('http://localhost:8000/health', timeout=2)\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  meili_data:
  hf_cache:
